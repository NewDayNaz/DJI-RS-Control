; PlatformIO project for the ESP32 WiFi <-> CAN (DJI R SDK) gimbal bridge.

[platformio]
default_envs = seeed_xiao_esp32c3
;
; Production target: Seeed Studio XIAO ESP32C3 seated on the official
; "XIAO CAN Bus Expansion Board" (MCP2515 SPI controller + SN65HVD230).
; That hat does not wire the C3's TWAI pins, so [env:seeed_xiao_esp32c3]
; builds the MCP2515 backend in src/can_hw.cpp.
;
; [env:esp32_c6_devkit_nx] is leftover bench silicon (Waveshare C6 + TWAI).
; Do not TX on the gimbal accessory bus from that board.

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; 4MB chip, same ~1.35MB firmware.bin as the C6. default.csv's 1.31MB OTA slot
; does not fit; huge_app is a 3MB app + ~896KB LittleFS.
board_build.partitions = huge_app.csv

; XIAO ESP32C3 uses native USB (no separate USB-serial chip); this flag routes
; Serial.print() over that USB-CDC port so `pio device monitor` works.
; D6/D7 on the hat are MCP2515 INT/CS, which is the same pair as UART0 TX/RX —
; USB CDC is what keeps a serial console.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCORE_DEBUG_LEVEL=1
    -DCAN_BACKEND_MCP2515=1
    -DMCP2515_CLOCK_MHZ=16
    -DGIMBAL_SLEEP_ENABLED=0

lib_deps =
    https://github.com/mathieucarbou/ESPAsyncWebServer.git
    https://github.com/mathieucarbou/AsyncTCP.git
    bblanchon/ArduinoJson @ ^7.0.4
    tzapu/WiFiManager @ ^2.0.17
    autowp/autowp-mcp2515 @ ^1.3.1

; Interim bring-up target: Waveshare ESP32-C6-DEV-KIT-NX + a bare transceiver on
; GPIO6/7 via the C6 TWAI controller. Kept so the bench board still compiles;
; it is not the production CAN path.
[env:esp32_c6_devkit_nx]
; The official/registry "espressif32" platform (platformio/platform-espressif32) still ships
; ESP32-C6's board definition with frameworks: ["espidf"] only — no Arduino support — so
; `platform = espressif32` fails here with "This board doesn't support arduino framework!".
; The community-maintained pioarduino fork tracks current Arduino-ESP32 core releases and
; does support Arduino on the C6; pin it to a specific release zip for reproducible builds.
; Check https://github.com/pioarduino/platform-espressif32/releases for newer tags.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Board flash is 8MB but the stock env still uses default.csv (1.31MB app0).
; firmware.bin is ~1.35MB, so the bootloader rejects it. See partitions/8MB_noota.csv.
board_build.partitions = partitions/8MB_noota.csv

build_flags =
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCORE_DEBUG_LEVEL=1
    -DCAN_BACKEND_TWAI=1
    ; GPIO6/7 are plain GPIOs on this board: not strapping pins (those are 4/5/8/9/15), not
    ; the USB-JTAG pair (12/13), not SDIO-default (18/19).
    -DCAN_TX_GPIO_NUM=6
    -DCAN_RX_GPIO_NUM=7
    -DGIMBAL_SLEEP_ENABLED=0

lib_deps =
    https://github.com/mathieucarbou/ESPAsyncWebServer.git
    https://github.com/mathieucarbou/AsyncTCP.git
    bblanchon/ArduinoJson @ ^7.0.4
    tzapu/WiFiManager @ ^2.0.17
