; PlatformIO project for the ESP32 WiFi <-> CAN (DJI R SDK) gimbal bridge.
;
; Target: Seeed Studio XIAO ESP32C3 seated on the official
; "XIAO CAN Bus Expansion Board" (MCP2515 SPI controller + SN65HVD230).
; That hat does not wire the C3's TWAI pins; src/can_hw.cpp talks MCP2515.

[platformio]
default_envs = seeed_xiao_esp32c3

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; 4MB chip. default.csv's 1.31MB OTA slot is smaller than firmware.bin;
; huge_app is a 3MB app + ~896KB LittleFS.
board_build.partitions = huge_app.csv

; XIAO ESP32C3 uses native USB (no separate USB-serial chip); this flag routes
; Serial.print() over that USB-CDC port so `pio device monitor` works.
; D6/D7 on the hat are MCP2515 INT/CS, which is the same pair as UART0 TX/RX —
; USB CDC is what keeps a serial console.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCORE_DEBUG_LEVEL=1
    -DMCP2515_CLOCK_MHZ=16
    -DGIMBAL_SLEEP_ENABLED=0

lib_deps =
    https://github.com/mathieucarbou/ESPAsyncWebServer.git
    https://github.com/mathieucarbou/AsyncTCP.git
    bblanchon/ArduinoJson @ ^7.0.4
    tzapu/WiFiManager @ ^2.0.17
    autowp/autowp-mcp2515 @ ^1.3.1
